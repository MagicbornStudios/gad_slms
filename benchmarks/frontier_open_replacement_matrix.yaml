purpose: |
  Concrete eval matrix that fires across models for the Big-Base
  Replacement Track (slm-learning-213). Rows = models in the 5-tier
  stack + frontier comparator. Cols = task shapes / benchmarks.
  Each cell pre-registers a pass_threshold and the current status
  (in_distribution / measured / in_flight / pending). Cells with
  status: pending carry the eval-fire command for repro.

  The replacement claim rides on cells flagged primary_replacement_target:
  the Big-Base candidate (32B LoRA from Phase 3a OR 80B-A3B LoRA from
  Phase 3b) must beat 7B Stein on >=7 task_shapes AND cost-per-success
  must drop below Opus on routine rows.

