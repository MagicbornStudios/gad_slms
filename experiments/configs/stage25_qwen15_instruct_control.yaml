name: stage25_qwen15_instruct_control
base_model: Qwen/Qwen2.5-1.5B-Instruct
adapter: lora
compute_target: local-cuda-0
notes: >
  Stage 2.5 base upgrade: instruction-following control. Qwen2.5-1.5B-Instruct
  is the same parameter count + tokenizer as the reasoning candidate, but
  tuned for terse instruction-following rather than chain-of-thought. Better
  prior for "Output only the command on one line" — the GAD-CLI eval's
  primary metric. Decision slm-learning-022.

  Paired with stage25_qwen15_distill_reasoning so we get the empirical
  answer on which 1.5B Qwen variant fits which metric, not a guess.

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  source: jsonl_pairs
  path: data/gad_tool_pairs.jsonl
  # Longest pair = 193 chars (~55 tokens with chat template). 128 is plenty
  # and cuts activation memory + step time vs the previous 512.
  max_length: 128
  instruction_field: instruction
  response_field: command
  system_prompt: >-
    You are Dr. Stein. Translate the user's request into a single gad
    CLI command. Output only the command on one line.

training:
  epochs: 3
  learning_rate: 2.0e-4
  # Shorter sequences let us double batch size without exceeding the 6GB
  # ceiling. Same effective batch (16 = 8 * 2) with half the sync steps.
  batch_size: 8
  gradient_accumulation: 2
  warmup_ratio: 0.05
  weight_decay: 0.0
  # Empirical (2026-05-05 A/B): bf16 trained 3.2x faster than fp16
  # on this 1660 Ti (240s vs 769s) with identical 22/30 GAD-tools.
  # The theoretical "Turing has no BF16 tensor cores" is true, but
  # TRL's fp16 path adds GradScaler overhead that costs more than
  # bf16's slower matmul saves. Identical result, 3x cheaper.
  bf16: true
  fp16: false
  gradient_checkpointing: true
  seed: 42
  # We only need the final adapter; intermediate epoch saves cost ~30s
  # each and add nothing useful.
  save_strategy: "no"
  logging_steps: 5

eval:
  run_after_train: true
  benchmarks:
    - gad_tools
    - humaneval
    - gsm8k
  temperature: 0.0
  max_new_tokens: 50
