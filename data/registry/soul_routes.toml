# Primary: global planning, cross-cutting framework/platform direction,
#          apps/platform, marketing surfaces, get-anything-done corp.
# Faction: GAD-strategy (Gilgamesh-house, prompt-only today).
# No fine-tune gate defined yet — strategy tasks harder to eval than code.
