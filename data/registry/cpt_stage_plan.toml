# CPT Stage Plan — Kael 7B Chain, First 5 Stages
# Schema: slm_learning/schemas/cpt_stage.schema.json
# Report:  slm_learning/reports/research/staged_continual_pretraining.md
# Date:    2026-05-09
# Status:  All stages planned. v1 fires first; each subsequent stage requires
#          parent status=promoted before authorizing.

[[stages]]
stage_id                    = "kael-7b-cpt-v1"
parent_stage_id             = null
status                      = "planned"
expansion_dataset_block_id  = "gad-trace-recent-60d-v1"
expansion_token_count       = 1_000_000
expansion_token_budget_max  = 1_500_000
expected_outcome            = "Smoke-test the LoRA-CPT recipe on 7B. Encode recent gad CLI patterns from the last 60 days of gad-trace curator output. Validate the gad_tools_v1 judge on 20 held-out rows before declaring done. Budget is tight by design — if the recipe fails here it costs $2-3, not $50."
retain_banks_enforced       = ["hard-fn-norm-v1"]

[stages.target_model]
soul_id              = "kael"
base_model_id        = "Qwen/Qwen2.5-Coder-7B-Instruct"
current_lane         = "7b"
cumulative_adapter_path = null

[stages.training_recipe]
mode                  = "lora_cpt"
lr                    = 2e-5
batch_size            = 4
gradient_accumulation = 8
sequence_length       = 8192
epochs                = 1
lora_rank             = 16
lora_alpha            = 16
lora_dropout          = 0.05
warmup_steps          = 50
scheduler             = "cosine"
bf16                  = true

[stages.eval_gates]
[stages.eval_gates.regression_thresholds]
"hard-fn-norm-v1" = 1.0

[stages.eval_gates.promotion_thresholds]
"gad-tools-v1" = 2.0

cost_per_success_target_usd = 5.0

[stages.eval_gates.hard_floor]
"humaneval-clean-v1" = 80.0

[stages.run_meta]
runtime               = "modal"
authorization_required = false
planned_start         = null
planned_complete      = null

[stages.run_meta.compute_estimate]
gpu_hours    = 1.5
gpu_type     = "A100-80GB"
est_cost_usd = 3.00

