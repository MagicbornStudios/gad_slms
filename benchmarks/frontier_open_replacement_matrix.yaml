success_rules:
  primary_replacement_target: opus-4-5
  candidate_models:
    - qwen3-coder-next-80b-a3b
    - qwen2.5-coder-32b-instruct
  rules:
    - id: r1_beat_7b_on_seven_task_shapes
      description: |
        The Big-Base candidate (after Phase 3 LoRA SFT) must beat 7B
        Stein canonical on at least 7 of the listed task_shapes by a
        margin >= 1.0pp on each, with no >2pp regression on any
        owned-domain row (gad_tools, kael_code_task, gad_decision).
    - id: r2_cost_per_success_below_opus
      description: |
        Cost-per-successful-task on the Big-Base candidate must be
        strictly below Opus per-Mtok cost at the same task on routine
        rows (Tier 1 + Tier 2).
    - id: r3_escalation_rate_trend_below_30pct
      description: |
        After 30 days of Gateway production data (slm-learning-208),
        frontier escalation rate (calls that escalate to Opus despite
        local handling) must trend below 30% on Tier 1 + Tier 2 task
        shapes.
    - id: r4_no_owned_domain_regression
      description: |
        gad_tools owned-domain delta vs 7B Stein must be >= 0. The moat
        is non-negotiable per slm-learning-199.

cost_containment:
  total_matrix_fire_budget_usd: 30.0
  notes: |
    Full matrix fire is bounded at $30. Pending cells fire in priority
    order: (1) candidate vs 7B on owned-domain rows, (2) candidate vs
    Opus on cost-ceiling rows, (3) leaderboard rows for paper artifact.
    Drop low-priority cells if budget tightens.
