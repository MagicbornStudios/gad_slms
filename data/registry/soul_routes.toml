created_at     = "2026-05-09T00:00:00Z"
updated_at     = "2026-05-09T00:00:00Z"
notes          = "DRAFT/PLANNED — not active. Represents the target route post Kael-house canonical. adapter_stack entry is skeleton until consolidation run ships. Eval gate: trajectory composite > 0.601 (Kael-house flagship run per souls_houses_factions_framework.md)."

[souls.base_model]
provider  = "modal"
model_id  = "qwen2.5-coder-7b-instruct"
version   = "TBD"

[souls.endpoint]
kind     = "self-hosted"
url      = ""            # GAP: Modal vLLM serve config (Lane D) not deployed
auth_ref = "MODAL_TOKEN"

[souls.routing_policy]
task_shapes            = ["code-generation", "tool-action", "narrative", "planning", "computer-use"]
