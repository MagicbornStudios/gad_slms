# soul_routes.toml
# Dispatch table: GAD soul -> base model + adapter stack + endpoint.
# Schema: slm_learning/schemas/soul_route.schema.json (JSON Schema 2020-12)
# Decoupled from gad narrative (personality/voice): narrative owns WHO the soul is;
# this file owns WHICH MODEL serves it today.
# Updated: 2026-05-09
# Decision refs: souls_houses_factions_framework.md (slm-learning-193 proposed)

# ---------------------------------------------------------------------------
# KAEL OF TARRO
# Primary: apps/desktop chat shell, Magicborn narrative work.
# Faction: GAD-artifact + GAD-tool-action (Kael-house, per framework doc).
# Today: Anthropic Sonnet fallback — Kael-house dataset capture not yet built.
# Target: gad-owned kael-7b-v1 when Kael-house 1.5B/3B adapter clears
#         trajectory composite > 0.601 gate (souls_houses_factions_framework.md).
# ---------------------------------------------------------------------------
[[souls]]
soul_id        = "kael-of-tarro"
soul_name      = "Kael of Tarro"
project_scope  = ["global", "apps-desktop"]
default_project = "global"
license_class  = "restricted"
created_at     = "2026-05-09T00:00:00Z"
updated_at     = "2026-05-09T00:00:00Z"
notes          = "Anthropic-base fallback. Intended route: gad-owned kael-7b-v1 post Kael-house adapter canonical. See intended route entry below."

[souls.base_model]
provider  = "anthropic"
model_id  = "claude-sonnet-4-6"
version   = "latest"

[souls.endpoint]
kind     = "api"
url      = "https://api.anthropic.com"
auth_ref = "ANTHROPIC_API_KEY"

[souls.routing_policy]
task_shapes            = ["code-generation", "tool-action", "narrative", "planning", "computer-use"]
fallback_soul_id       = "gilgamesh-of-uruk"
cost_cap_usd_per_call  = 0.10
latency_budget_ms      = 8000

[souls.evolution_state]
current_level   = 0
last_evolved_at = ""    # not yet promoted

skill_adapters = ["frontend-design", "gad-visual-context-system"]

# ---------------------------------------------------------------------------
# KAEL-INTENDED-ROUTE (future state — adapter not trained yet)
# Route after Kael-house 1.5B canonical consolidation run ships.
# Wired via 'adapter_stack' once lora-kael-1p5b-v1 clears eval gate.
# ---------------------------------------------------------------------------
[[souls]]
soul_id        = "kael-of-tarro-v1-intended"
soul_name      = "Kael of Tarro (intended: gad-owned adapter route)"
project_scope  = ["global", "apps-desktop"]
default_project = "global"
