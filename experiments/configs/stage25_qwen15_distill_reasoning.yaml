name: stage25_qwen15_distill_reasoning
base_model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
adapter: lora
compute_target: local-cuda-0
notes: >
  Stage 2.5 base upgrade: reasoning track. DeepSeek-R1-Distill-Qwen-1.5B
  is the strongest published 1.5B reasoning model — distilled from R1 on
  math/code/reasoning traces. Caveat: it emits <think>...</think> blocks
  by default, which may hurt the single-line GAD-CLI metric but should
  help HumanEval/GSM8K vs the 0/0 baseline. Decision slm-learning-022.

  Same Qwen tokenizer family as the control config; same target_modules;
  same training schedule on the same 153 GAD-tool pairs. Apples-to-apples
  comparison with stage25_qwen15_instruct_control.

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

data:
  source: jsonl_pairs
  path: data/gad_tool_pairs.jsonl
  # Longest pair = 193 chars (~55 tokens with chat template). 128 is plenty
  # and cuts activation memory + step time vs the previous 512.
  max_length: 128
  instruction_field: instruction
  response_field: command
  system_prompt: >-
    You are Dr. Stein. Translate the user's request into a single gad
    CLI command. Output only the command on one line.

training:
  epochs: 3
  learning_rate: 2.0e-4
  # DeepSeek-R1-Distill-Qwen-1.5B is structurally larger (1.78B params,
  # bigger attention scratch) than Qwen2.5-1.5B and OOMed at bs=8 step 6.
  # Drop to bs=4 grad_accum=4 (effective batch=16 still). Keep this number
  # divergent from the control config so each fits its own headroom.
  batch_size: 4
  gradient_accumulation: 4
  warmup_ratio: 0.05
  weight_decay: 0.0
  # Turing (1660 Ti, compute 7.5) has no native bf16 tensor cores —
  # fp16 engages the FP16 tensor cores and runs faster. Flip back to
  # bf16 only when training on Ampere+ remote (Colab T4 / Kaggle).
  bf16: false
  fp16: true
  gradient_checkpointing: true
  seed: 42
  # We only need the final adapter; intermediate epoch saves cost ~30s
  # each and add nothing useful.
  save_strategy: "no"
  logging_steps: 5

eval:
  run_after_train: true
  benchmarks:
    - gad_tools
    - humaneval
    - gsm8k
  temperature: 0.0
  max_new_tokens: 50
