# Hypothesis: 100 reasoning pairs is too few; doubling the synthetic
# pair budget gives the model more variety per epoch.
stage: reasoning
ckpt: runs/finetuned/sft_model.pt
epochs: 5
lr: 1.0e-5
max_pairs: 200
block_size: 512
device: auto
notes: "Test whether 200 pairs (vs 100) improves alignment without overfitting."
